[project]
name = "ajt-negative-proof-sim"
version = "0.1.0"
description = "Demonstrating audit-grade negative proof using minimal judgment traces (AJT)"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["sim/tests"]
pythonpath = ["."]
